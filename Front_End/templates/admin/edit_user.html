<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Pengguna - MathThon Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="icon" href="{{ url_for('static', filename='image/Toko Masabuk Jaya-fotor-bg-remover-2025102202457.png') }}">
    <style>
        body {
            background-color: #e9ecef;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .navbar {
            background-color: #ffffff !important;
            box-shadow: 0 4px 8px rgba(0,0,0,.05);
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-light bg-white mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('admin.dashboard_admin') }}">
            <img src="{{ url_for('static', filename='image/Toko Masabuk Jaya-fotor-bg-remover-2025102202457.png') }}" alt="Logo" width="30" height="30" class="d-inline-block align-text-top">
            MathThon Admin
        </a>
    </div>
</nav>

<div class="container">
    <h1 class="mb-4">Edit Pengguna</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" action="{{ url_for('admin.edit_user', user_id=user.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="name" class="form-label">Nama</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                </div>
                <div class="mb-3">
                    <label for="born_place" class="form-label">Tempat Lahir</label>
                    <input type="text" class="form-control" id="born_place" name="born_place" value="{{ user.born_place }}">
                </div>
                <div class="mb-3">
                    <label for="born_date" class="form-label">Tanggal Lahir</label>
                    <input type="date" class="form-control" id="born_date" name="born_date" value="{{ user.born_date }}">
                </div>
                <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                <a href="{{ url_for('admin.manage_users') }}" class="btn btn-secondary">Batal</a>
            </form>
        </div>
    </div>
</div>

<footer class="mt-auto py-3 bg-light text-center">
    <div class="container">
        <span class="text-muted">&copy; 2025 MathThon Admin. All rights reserved.</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
