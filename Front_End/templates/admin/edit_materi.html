<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Edit Materi</title>
    <link rel="icon" href="{{ url_for('static', filename='image/Toko Masabuk Jaya-fotor-bg-remover-2025102202457.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4><i class="bi bi-pencil-square"></i> Edit Materi: {{ materi.judul_materi }}</h4>
                </div>
                <div class="card-body">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label">Judul Materi</label>
                            <input type="text" class="form-control" name="judul_materi" value="{{ materi.judul_materi }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Slug <small class="text-muted">(contoh: aljabar-linear)</small></label>
                            <input type="text" class="form-control" name="slug" value="{{ materi.slug or '' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Deskripsi</label>
                            <textarea class="form-control" name="deskripsi" rows="3">{{ materi.deskripsi or '' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">URL Gambar</label>
                            <input type="url" class="form-control" name="image_url" value="{{ materi.image_url or '' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="status">
                                <option value="active" {% if materi.status == 'active' %}selected{% endif %}>Active</option>
                                <option value="inactive" {% if materi.status == 'inactive' %}selected{% endif %}>Inactive</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rating (0-5)</label>
                            <input type="number" class="form-control" name="rating" min="0" max="5" value="{{ materi.rating or 0 }}">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Content (Markdown + LaTeX)</label>
                            <textarea class="form-control" name="content" rows="15">{{ materi.content or '' }}</textarea>
                            <small class="form-text text-muted mt-2">
                                Gunakan Markdown dan LaTeX: # H1, ## H2, **bold**, $inline$, $$block math$$
                            </small>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Update Materi
                        </button>
                        <a href="{{ url_for('admin.manage_materi') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Kembali
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
