<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathThon | Login Sebagai Admin</title>
    <link rel="icon" href="{{ url_for('static', filename='image/Toko Masabuk Jaya-fotor-bg-remover-2025102202457.png') }}">
    
    <!-- Bootstrap 5 & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <!-- Custom Admin Login CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/css_for_login_admin.css') }}">
</head>
<body class="admin-login-body">
    <!-- Ambient Glow Orbs -->
    <div class="login-glow-orb login-glow-1"></div>
    <div class="login-glow-orb login-glow-2"></div>

    <section class="login-admin-card animate__animated animate__fadeInDown">
        <div class="admin-logo-wrapper">
            <img src="{{ url_for('static', filename='image/Toko Masabuk Jaya-fotor-bg-remover-2025102202457.png') }}"
                 alt="Logo MathThon" class="admin-logo animate__animated animate__zoomIn" />
        </div>

        <div class="login-header-text">
            <h2>Portal <span class="highlight">Admin</span></h2>
            <p class="login-subtitle">Masuk untuk mengelola seluruh ekosistem MathThon</p>
        </div>

        <form method="POST" action="{{ url_for('admin.login_admin') }}" autocomplete="off">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            {% if error %}
                <div class="error-message animate__animated animate__shakeX">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span>{{ error }}</span>
                </div>
            {% endif %}

            <div class="login-field-group">
                <label for="username">Username Admin <span class="text-danger">*</span></label>
                <div class="login-input-container">
                    <i class="bi bi-person-fill input-icon"></i>
                    <input type="text" autocomplete="username" class="form-control" id="username" name="username" required placeholder="Masukkan username Anda">
                </div>
            </div>

            <div class="login-field-group">
                <label for="password">Password <span class="text-danger">*</span></label>
                <div class="login-input-container">
                    <i class="bi bi-shield-lock-fill input-icon"></i>
                    <input type="password" autocomplete="current-password" class="form-control" id="password" name="password" required placeholder="Masukkan password Anda">
                </div>
            </div>

            <button type="submit" class="animate__animated animate__pulse">
                <span>Masuk ke Dashboard</span>
                <i class="bi bi-arrow-right"></i>
            </button>
            
            <a class="return-link" href="{{ url_for('main.home') }}">
                <i class="bi bi-arrow-left"></i>
                <span>Kembali ke Beranda</span>
            </a>
        </form>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
