<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Tambah Materi Baru</title>
    <link rel="icon" href="{{ url_for('static', filename='image/Toko Masabuk Jaya-fotor-bg-remover-2025102202457.png') }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4><i class="bi bi-plus-circle"></i> Tambah Materi Baru</h4>
                </div>
                <div class="card-body">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"> 
                        <div class="mb-3">
                            <label class="form-label">Judul Materi</label>
                            <input type="text" class="form-control" name="judul_materi" placeholder="Contoh: Aljabar Linier" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Slug <small class="text-muted">(lowercase, no space, e.g. aljabar)</small></label>
                            <input type="text" class="form-control" name="slug" placeholder="aljabar">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Deskripsi</label>
                            <textarea class="form-control" name="deskripsi" rows="3" placeholder="Deskripsi singkat materi..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">URL Gambar (opsional)</label>
                            <input type="url" class="form-control" name="image_url" placeholder="https://example.com/image.jpg">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="status">
                                <option value="active" selected>Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rating (0-5)</label>
                            <input type="number" class="form-control" name="rating" min="0" max="5" placeholder="4" value="0">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Content (Markdown + LaTeX)</label>
                            <textarea class="form-control" name="content" rows="15" placeholder="# Judul\n\nTeks dengan $x^2$ dan rumus $$\int x dx$$"></textarea>
                            <small class="form-text text-muted mt-2">
                                Gunakan Markdown dan LaTeX: # H1, ## H2, **bold**, $inline$, $$block math$$
                            </small>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Tambah Materi
                        </button>
                        <a href="{{ url_for('admin.manage_materi') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Kembali
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
