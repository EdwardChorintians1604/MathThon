<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathThon | Reset Password </title>
    <link rel="icon" href="{{ url_for('static', filename='image/Toko Masabuk Jaya-fotor-bg-remover-2025102202457.png') }}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');
        * {
            margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif;
        }
        body {
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: linear-gradient(to top, rgb(0, 0, 0), rgb(100, 96, 96));
            background-size: cover; background-position: center;
        }
        .reset-box {
            position: relative; width: 400px; background: transparent;
            border: 2px solid rgba(255, 255, 255, .5); border-radius: 20px;
            backdrop-filter: blur(15px); display: flex; justify-content: center;
            align-items: center; padding: 40px;
        }
        .reset-box h2 {
            font-size: 2em; color: #fff; text-align: center; margin-bottom: 20px;
        }
        .input-box {
            position: relative; width: 100%; margin: 25px 0;
            border-bottom: 2px solid #fff;
        }
        .input-box label {
            position: absolute; top: 50%; left: 5px; transform: translateY(-50%);
            color: #fff; font-size: 1em; pointer-events: none; transition: .5s;
        }
        .input-box input:focus~label,
        .input-box input:valid~label {
            top: -5px;
        }
        .input-box input {
            width: 100%; height: 50px; background: transparent; border: none;
            outline: none; font-size: 1em; color: #fff; padding: 0 35px 0 5px;
        }
        .btn-submit {
            width: 100%; height: 45px; background: #fff; border: none;
            outline: none; border-radius: 40px; cursor: pointer;
            font-size: 1em; color: #000; font-weight: 600;
            margin-top: 20px;
        }
        .alert {
            color: white; text-align: center; padding: 10px;
            border: 1px solid crimson; border-radius: 5px; margin-bottom: 15px;
        }
        .back-link {
            text-align: center; margin-top: 15px;
        }
        .back-link a {
            color: white; text-decoration: none; font-weight: 600;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<section class="reset-box">
    <form action="{{ url_for('auth.reset_password_user', token=token) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h2>Reset Password Anda</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="input-box">
            <input type="password" id="new_password" name="new_password" required>
            <label for="new_password">Password Baru *</label>
        </div>

        <button type="submit" class="btn-submit">Reset Password</button>

        <div class="back-link">
            <p><a href="{{ url_for('auth.login_user') }}">Kembali ke Halaman Login</a></p>

        </div>
    </form>
</section>
</body>
</html>
