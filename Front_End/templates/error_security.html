<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathThon | {{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #1a1a2e;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .error-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .icon {
            font-size: 5rem;
            color: #ff4757;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="error-card animate__animated animate__zoomIn">
        <div class="icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1 class="mb-3">{{ title }}</h1>
        <p class="lead opacity-75 mb-4">{{ message }}</p>
        <p class="text-secondary small">Error Code: {{ code }}</p>
        <hr class="border-secondary">
        <a href="/" class="btn btn-outline-light mt-3">Kembali ke Beranda</a>
    </div>
</body>
</html>
